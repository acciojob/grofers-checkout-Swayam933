<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grofers Checkout</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h2>🛒 Grofers Checkout</h2>

  <table id="grocery-table">
    <thead>
      <tr>
        <th>Item</th>
        <th>Price (₹)</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="item">Milk</td>
        <td class="prices">50</td>
      </tr>
      <tr>
        <td class="item">Bread</td>
        <td class="prices">35</td>
      </tr>
      <tr>
        <td class="item">Eggs (12)</td>
        <td class="prices">80</td>
      </tr>
      <tr>
        <td class="item">Butter</td>
        <td class="prices">120</td>
      </tr>
      <tr>
        <td class="item">Rice (1kg)</td>
        <td class="prices">60</td>
      </tr>
      <tr>
        <td class="item">Sugar (1kg)</td>
        <td class="prices">45</td>
      </tr>
    </tbody>
  </table>

  <script src="script.js"></script>

</body>
</html>
